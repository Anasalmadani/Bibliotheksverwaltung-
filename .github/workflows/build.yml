name: Lazarus Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Lazarus installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus

      - name: lazbuild suchen
        run: |
          which lazbuild || true
          find /usr -name "lazbuild*" -type f 2>/dev/null || true
          ls

      - name: Projekt bauen
        run: |
          LB=$(command -v lazbuild || find /usr -name lazbuild -type f | head -n1)
          echo "Benutze: $LB"
          "$LB" Bibliotheksverwaltung.lpi

      - name: Programm speichern
        uses: actions/upload-artifact@v4
        with:
          name: bibliotheksverwaltung
          path: Bibliotheksverwaltung

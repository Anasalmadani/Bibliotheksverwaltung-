name: Lazarus Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Lazarus installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus

      - name: Projekt bauen
        run: lazbuild project1.lpi

      - name: Programm speichern
        uses: actions/upload-artifact@v4
        with:
          name: bibliotheksverwaltung
          path: project1
          if-no-files-found: warn
